# Grid control plane — production only (build from source).
#
#   cp install/.env.example install/.env   # fill every required value
#   bash install/compose-up.sh             # runs check-env.sh then compose
#
# Always detached (-d). No development profile. Pre-built: compose-up.sh release

name: grid

services:
  core:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        GRID_CLI_REF: ${GRID_CLI_REF:-main}
        TERRAFORM_VERSION: ${TERRAFORM_VERSION:-1.9.8}
    env_file:
      - path: .env
        required: true
    environment:
      PORT: "3000"
      GRID_APP_ENV: production
      GRID_CLI_ROOT: /opt/grid/grid-cli
      GRID_DATA_DIR: /var/lib/grid/data
      GRID_WORK_DIR: /var/lib/grid/workspaces
      GRID_CONFIG_ROOT: /var/lib/grid/desired-state
      GRID_MODULE_BANK: ${GRID_MODULE_BANK:?set GRID_MODULE_BANK in install/.env}
      GRID_MODULE_BANK_REF: ${GRID_MODULE_BANK_REF:?set GRID_MODULE_BANK_REF=v0.1.0 in install/.env}
      GRID_GITOPS_REPO_URL: ${GRID_GITOPS_REPO_URL:?set GRID_GITOPS_REPO_URL in install/.env}
      GRID_GITOPS_BRANCH: ${GRID_GITOPS_BRANCH:?set GRID_GITOPS_BRANCH in install/.env}
      GRID_AUTH_ADMIN_EMAIL: ${GRID_AUTH_ADMIN_EMAIL:?set GRID_AUTH_ADMIN_EMAIL in install/.env}
      GRID_AUTH_ADMIN_PASSWORD: ${GRID_AUTH_ADMIN_PASSWORD:?set GRID_AUTH_ADMIN_PASSWORD in install/.env}
      GRID_TF_BACKEND: ${GRID_TF_BACKEND:?set GRID_TF_BACKEND=s3|gcs|azurerm in install/.env}
      GRID_TF_STATE_BUCKET: ${GRID_TF_STATE_BUCKET:-}
      GRID_TF_LOCK_TABLE: ${GRID_TF_LOCK_TABLE:-}
      GRID_TF_STATE_REGION: ${GRID_TF_STATE_REGION:-}
      GRID_TF_AZURE_RESOURCE_GROUP: ${GRID_TF_AZURE_RESOURCE_GROUP:-}
      GRID_TF_AZURE_STORAGE_ACCOUNT: ${GRID_TF_AZURE_STORAGE_ACCOUNT:-}
      GRID_TF_AZURE_CONTAINER: ${GRID_TF_AZURE_CONTAINER:-}
    volumes:
      - grid-data:/var/lib/grid/data
      - grid-workspaces:/var/lib/grid/workspaces
      - grid-desired-state:/var/lib/grid/desired-state
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  ui:
    build:
      context: ${GRID_UI_CONTEXT:-https://github.com/gridplatform/grid-ui.git#${GRID_UI_REF:-main}}
      dockerfile: Dockerfile
      args:
        VITE_GRID_API_URL: /api/v1
    ports:
      - "${GRID_HTTP_PORT:-80}:80"
    depends_on:
      core:
        condition: service_started
    restart: unless-stopped

volumes:
  grid-data:
  grid-workspaces:
  grid-desired-state:
