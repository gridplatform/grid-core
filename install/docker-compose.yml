# Grid control plane — Docker Compose
#
# Always run DETACHED (-d). Do NOT use foreground `up` on a server — closing
# SSH would not stop containers if -d was used, but foreground ties to the TTY.
#
#   cp install/.env.example install/.env   # edit password + GRID_TF_*
#   docker compose -f install/docker-compose.yml --env-file install/.env up -d --build
#
# Persistence:
#   - restart: unless-stopped  → containers recover after crash / Docker restart
#   - systemctl enable docker  → Docker starts on reboot
#   - optional: install/systemd/grid-compose.service → re-runs `compose up -d` on boot
#
# UI image builds from the public grid-ui repo (override with GRID_UI_CONTEXT).
# Core image clones grid-cli during docker build.

name: grid

services:
  core:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        GRID_CLI_REF: ${GRID_CLI_REF:-main}
        TERRAFORM_VERSION: ${TERRAFORM_VERSION:-1.9.8}
    # Optional extra file; --env-file / environment: below are enough for a fresh install
    env_file:
      - path: .env
        required: false
    environment:
      PORT: "3000"
      GRID_CLI_ROOT: /opt/grid/grid-cli
      GRID_DATA_DIR: /var/lib/grid/data
      GRID_WORK_DIR: /var/lib/grid/workspaces
      GRID_CONFIG_ROOT: /var/lib/grid/desired-state
      GRID_MODULE_BANK: ${GRID_MODULE_BANK:-https://github.com/gridplatform/grid-terraform.git}
      GRID_MODULE_BANK_REF: ${GRID_MODULE_BANK_REF:-main}
      GRID_GITOPS_REPO_URL: ${GRID_GITOPS_REPO_URL:-https://github.com/gridplatform/grid-config.git}
      GRID_GITOPS_BRANCH: ${GRID_GITOPS_BRANCH:-main}
      GRID_AUTH_ADMIN_EMAIL: ${GRID_AUTH_ADMIN_EMAIL:-admin@grid.local}
      GRID_AUTH_ADMIN_PASSWORD: ${GRID_AUTH_ADMIN_PASSWORD:?set GRID_AUTH_ADMIN_PASSWORD in install/.env}
      GRID_AUTO_APPROVE: ${GRID_AUTO_APPROVE:-true}
      GRID_TF_BACKEND: ${GRID_TF_BACKEND:-local}
      GRID_TF_STATE_BUCKET: ${GRID_TF_STATE_BUCKET:-}
      GRID_TF_LOCK_TABLE: ${GRID_TF_LOCK_TABLE:-}
      GRID_TF_STATE_REGION: ${GRID_TF_STATE_REGION:-}
      GRID_TF_AZURE_RESOURCE_GROUP: ${GRID_TF_AZURE_RESOURCE_GROUP:-}
      GRID_TF_AZURE_STORAGE_ACCOUNT: ${GRID_TF_AZURE_STORAGE_ACCOUNT:-}
      GRID_TF_AZURE_CONTAINER: ${GRID_TF_AZURE_CONTAINER:-}
    volumes:
      - grid-data:/var/lib/grid/data
      - grid-workspaces:/var/lib/grid/workspaces
      - grid-desired-state:/var/lib/grid/desired-state
    # Optional cloud creds for terraform apply from this host:
    #   - ${HOME}/.aws:/root/.aws:ro
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  ui:
    build:
      context: ${GRID_UI_CONTEXT:-https://github.com/gridplatform/grid-ui.git#main}
      dockerfile: Dockerfile
      args:
        VITE_GRID_API_URL: /api/v1
    ports:
      - "${GRID_HTTP_PORT:-80}:80"
    depends_on:
      core:
        condition: service_started
    restart: unless-stopped

volumes:
  grid-data:
  grid-workspaces:
  grid-desired-state:
