# Prometheus — metrics store + alert rule evaluation.
# Operate: host binary/systemd. Grid Settings updates rules/ and POSTs /-/reload.
# remote_write from Alloy; Alertmanager at 127.0.0.1:9093.

global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['127.0.0.1:9093']

scrape_configs: []
