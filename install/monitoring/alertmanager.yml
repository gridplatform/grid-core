# Alertmanager — notify/routing.
# Operate: host binary/systemd. Grid Settings rewrites receivers/routes, then /-/reload.
# Default receiver drops until a channel is configured in the UI.

global:
  resolve_timeout: 5m

route:
  receiver: grid-null
  group_by: ['alertname', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: grid-null
