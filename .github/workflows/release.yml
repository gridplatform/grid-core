name: Release

# Publishes ghcr.io/gridplatform/grid-core and a GitHub Release on version tags.
#   Current: vX.Y.Z
#   LTS:     vX.Y.Z-lts
# Tag grid-cli with the same ref before this repository.

on:
  push:
    tags:
      - "v*.*.*"
      - "v*.*.*-lts"

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Parse version / channel
        id: meta
        run: |
          RAW="${GITHUB_REF_NAME}"
          VER="${RAW#v}"
          IS_LTS=false
          if [[ "$RAW" == *-lts ]]; then
            VER="${VER%-lts}"
            IS_LTS=true
          fi
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "is_lts=${IS_LTS}" >> "$GITHUB_OUTPUT"
          echo "cli_ref=${RAW}" >> "$GITHUB_OUTPUT"
          {
            echo "tags<<EOF"
            echo "ghcr.io/gridplatform/grid-core:${VER}"
            echo "ghcr.io/gridplatform/grid-core:current"
            if [[ "$IS_LTS" == "true" ]]; then
              echo "ghcr.io/gridplatform/grid-core:lts"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push grid-core
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          build-args: |
            GRID_CLI_REF=${{ steps.meta.outputs.cli_ref }}
          tags: ${{ steps.meta.outputs.tags }}

      - name: Write release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Fresh notes every publish. Updating a release with generated notes
          # appends another Full Changelog line, so the body is replaced below.
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f "tag_name=${GITHUB_REF_NAME}" \
            --jq .body > /tmp/generated.md
          python3 - << 'PY'
          from pathlib import Path
          lines = Path("/tmp/generated.md").read_text().splitlines()
          body, changelogs = [], []
          for line in lines:
              plain = line.replace("*", "").strip().lower()
              if plain.startswith("full changelog:"):
                  changelogs.append(line.strip())
              else:
                  body.append(line)
          while body and not body[-1].strip():
              body.pop()
          if changelogs:
              body += ["", changelogs[-1]]
          Path("release-notes.md").write_text("\n".join(body).rstrip() + "\n")
          PY

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.meta.outputs.is_lts == 'true' && format('v{0} LTS', steps.meta.outputs.version) || format('v{0}', steps.meta.outputs.version) }}
          body_path: release-notes.md
          append_body: false
